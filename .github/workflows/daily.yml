name: daily-update

on:
  # 主要觸發：外部定時服務（cron-job.org）每天 UTC 00:15 呼叫 workflow_dispatch（GitHub 排程實測常延遲約 5 小時）
  workflow_dispatch:
    inputs:
      test_notify:
        description: "只發送一則 LINE 測試通知（不更新數據）"
        type: boolean
        default: false
  # 備援：GitHub 自身排程；當天已更新就略過
  schedule:
    - cron: "15 0 * * *"
    - cron: "30 0 * * *"
    - cron: "15 3 * * *"

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 30

      - name: 檢查今天是否已更新（排程觸發才會略過；手動或外部觸發一律執行）
        id: chk
        run: |
          if [ "${{ inputs.test_notify }}" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "測試通知模式"; exit 0
          fi
          if [ "${{ github.event_name }}" = "schedule" ] \
             && git log -30 --format=%s | grep -qx "data: daily update $(date -u +%Y-%m-%d)"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "今天已更新，備援排程略過"
          fi

      # 測試／故障通知也需要 Python，因此一律安裝。只有真的會 pip install 的執行才用快取：
      # 略過的執行若遇到快取未命中（requirements 或 Python 版本變了），快取資料夾不存在，收尾步驟會報錯讓整個執行變成失敗
      - uses: actions/setup-python@v7
        if: steps.chk.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-python@v7
        if: steps.chk.outputs.skip == 'true'
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt
        if: steps.chk.outputs.skip != 'true'

      - name: 抓取數據並計算分數
        if: steps.chk.outputs.skip != 'true'
        run: python run.py

      - name: 自動檢查輸出（有錯誤就停止、不 commit）
        if: steps.chk.outputs.skip != 'true'
        run: python -m btc_top.checks

      - name: Commit 更新
        if: steps.chk.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "沒有變更"
          else
            git commit -m "data: daily update $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: LINE 通知（重要事件／新的資料警告）
        if: steps.chk.outputs.skip != 'true'
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python -m btc_top.notify

      - name: LINE 測試通知
        if: inputs.test_notify
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: pip install -q requests pandas && python -m btc_top.notify --test

      - name: LINE 故障通知
        if: failure()
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pip install -q requests pandas && python -m btc_top.notify --failure
